name: Dropbox分析レポートの実保存検証

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify_dropbox_option.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6.0.2
      - name: Pythonを準備
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
      - name: 必要なライブラリを準備
        run: pip install requests
      - name: 分析結果の指定保存先を検証
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_OPTION_DIRECTORY: /アプリ/remotely-save/Obsidian4dropbox/10_investment_insight/100_daily/option
        run: |
          python scripts/market/check_dropbox_location.py
